plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}
android {
  namespace 'org.dpdns.hanjomei.xraa'
  compileSdk 34
  buildToolsVersion "34.0.0"
  defaultConfig {
    applicationId "org.dpdns.hanjomei.xraa"
    minSdk 29
    targetSdk 34
    versionCode 2
    versionName "0.1.1"
    ndk { abiFilters 'arm64-v8a' }
  }
  signingConfigs {
    xra {
      // Optional release key: create keystore.properties (storeFile, storePassword, keyAlias, keyPassword)
      // in the project root. Without it, release builds use the local debug key.
      def kp = rootProject.file('keystore.properties')
      if (kp.exists()) {
        def p = new Properties(); kp.withInputStream { p.load(it) }
        storeFile rootProject.file(p['storeFile']); storePassword p['storePassword']
        keyAlias p['keyAlias']; keyPassword p['keyPassword']
      } else {
        def d = new File(System.getProperty('user.home'), '.android/debug.keystore')
        storeFile d; storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.xra
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  androidResources { noCompress 'task', 'tflite' }
  packagingOptions {
    jniLibs {
      useLegacyPackaging true
      excludes += ['**/libQnnDsp*.so', '**/libQnnHtpV68*.so', '**/libQnnHtpV69*.so', '**/libQnnHtpV73*.so', '**/libQnnHtpV79*.so', '**/libQnnHtpV81*.so', '**/libQnnGpu.so']
    }
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.webkit:webkit:1.11.0'
  def cx = '1.3.4'
  implementation "androidx.camera:camera-core:$cx"
  implementation "androidx.camera:camera-camera2:$cx"
  implementation "androidx.camera:camera-lifecycle:$cx"
  implementation "androidx.camera:camera-view:$cx"
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'
  def lt = '1.4.2'
  implementation "com.google.ai.edge.litert:litert:$lt"
  implementation "com.google.ai.edge.litert:litert-gpu:$lt"
  implementation "com.google.ai.edge.litert:litert-gpu-api:$lt"
  implementation 'com.qualcomm.qti:qnn-litert-delegate:2.51.0'
  implementation 'com.qualcomm.qti:qnn-runtime:2.51.0'
}
